# ~/.config/swampcy/sway.conf: the headless sway swampcy drives (see swampcy-sway.service).
# Your distribution's own sway config is not included: no bar,
# no idle or lock, no keybindings, since nobody types at this screen.

# Two desktops. HEADLESS-1 is the agents': fixed at the size swampcy's
# screenshots are sent at, so nothing is rescaled. HEADLESS-2 is the owner's: swampcy
# web sizes it to each viewer that asks for it, so its mode here is only a start.
output HEADLESS-1 mode 1280x800 position 0 0 scale 1
output HEADLESS-2 mode 1280x800 position 1280 0 scale 1
workspace 1 output HEADLESS-1
workspace 2 output HEADLESS-2

# Two seats. seat0 is the agents': swampcy's MCP servers join it, and sway's commands
# act on it. owner is the owner's: swampcy web's viewers join it, on either desktop,
# so the owner's taps never move the agents' focus. A seat is declared here, never at
# run time: adding one to a running sway takes the devices off the others.
seat seat0 fallback true
seat owner fallback false

# New windows open where seat0's focus is; start it on the agents' desktop.
focus output HEADLESS-1
exec swaymsg focus output HEADLESS-1

default_border normal 2
focus_follows_mouse no
focus_on_window_activation focus
font pango:Noto Sans 10
